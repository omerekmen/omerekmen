name: Verify Production

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

# Cloudflare Pages deploys master through its Git integration. It runs the
# build but not lint or typecheck, so this workflow gates quality — without it
# a branch that fails either would still go live.

jobs:
  verify:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun run build

      - name: Assert no untranslated keys reached the HTML
        run: bun run assert:messages

      - name: Check payload budget
        run: bun run check:budget
      # The mirror of the staging assertion. If production ever built as
      # staging, the live site would go noindex and quietly fall out of search.
      - name: Assert production is indexable
        run: |
          set -e
          grep -q 'Allow: /' .svelte-kit/cloudflare/robots.txt \
            || { echo "robots.txt is not allowing crawling"; cat .svelte-kit/cloudflare/robots.txt; exit 1; }
          if grep -q 'name="robots" content="noindex' .svelte-kit/cloudflare/index.html; then
            echo "production build carries a noindex tag"; exit 1
          fi
          echo "production build is correctly indexable"
